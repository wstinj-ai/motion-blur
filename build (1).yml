name: Build MotionBlurRT

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl /O2 /EHsc /nologo MotionBlurRT.cpp /Fe:MotionBlurRT.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MotionBlurRT
          path: MotionBlurRT.exe
